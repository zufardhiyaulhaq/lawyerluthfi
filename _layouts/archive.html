---
layout: default
call_to_action: Contact
background_image_path:
---

<section class="section no-rule" style="padding-bottom: 32px;">
	<div class="container">
		<div class="sec-head" style="margin-bottom: 0;">
			<div>
				<div class="eyebrow"><span class="dot"></span>Kategori</div>
				<h1 style="margin-top:16px;">{{ page.title }}</h1>
			</div>
			<p class="lead">Anda sedang melihat semua artikel pada kategori <strong>{{ page.title }}</strong>. <a href="{{ site.baseurl }}/blog/">Lihat semua artikel</a> sebagai gantinya.</p>
		</div>
	</div>
</section>

<section class="section no-rule">
	<div class="container">
		<ol class="blog-list">
			{% for post in page.posts %}
				{% include post-summary.html post=post %}
			{% endfor %}
		</ol>
	</div>
</section>
