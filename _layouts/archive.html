---
layout: default
call_to_action: Contact
background_image_path:
---

<section class="section no-rule" style="padding-bottom: 32px;">
	<div class="container">
		<div class="sec-head page-head" style="margin-bottom: 0;">
			<div>
				<div class="eyebrow"><span class="dot"></span><span data-i18n="archive.eyebrow">Kategori</span></div>
				<h1 style="margin-top:16px;">{{ page.title }}</h1>
			</div>
			<p class="lead" data-i18n="archive.lead.html">Anda sedang melihat semua artikel pada kategori <strong>{{ page.title }}</strong>. <a href="{{ site.baseurl }}/blog/">Lihat semua artikel</a> sebagai gantinya.</p>
		</div>
	</div>
</section>

<section class="section no-rule">
	<div class="container">
		<ol class="blog-list">
			{% for post in page.posts %}
				{% include post-summary.html post=post %}
			{% endfor %}
		</ol>
	</div>
</section>

<script>
	document.body.dataset.archiveTitle = {{ page.title | jsonify }};
	if (window.__i18n) window.__i18n.apply(window.__i18n.get());
</script>
