	var YEAR = new Date().getFullYear();
	var BLOG = "{{ site.baseurl }}/blog/";
	var DEFAULT_LANG = "id";
	var LANG_VERSION = "2"; // bump to invalidate stale localStorage choices

	function fmt(s, ctx) {
		return s.replace(/\{(\w+)\}/g, function (_, k) {
			return (ctx && ctx[k] != null) ? ctx[k] : ({ YEAR: YEAR, BLOG: BLOG }[k] || "");
		});
	}

	function getLang() {
		try {
			var ver = localStorage.getItem("lang_v");
			if (ver !== LANG_VERSION) {
				localStorage.removeItem("lang");
				localStorage.setItem("lang_v", LANG_VERSION);
				return DEFAULT_LANG;
			}
			var stored = localStorage.getItem("lang");
			if (stored === "id" || stored === "en") return stored;
		} catch (e) {}
		return DEFAULT_LANG;
	}

	function applyLang(lang) {
		var dict = I18N[lang] || I18N[DEFAULT_LANG];
		document.documentElement.lang = lang;
		var ctx = { TITLE: document.body.dataset.archiveTitle || "" };
		document.querySelectorAll("[data-i18n]").forEach(function (el) {
			var key = el.getAttribute("data-i18n");
			var val = dict[key];
			if (val == null) return;
			if (key.endsWith(".html") || el.hasAttribute("data-i18n-html")) {
				el.innerHTML = fmt(val, ctx);
			} else {
				el.textContent = fmt(val, ctx);
			}
		});
		document.querySelectorAll("[data-i18n-attr]").forEach(function (el) {
			var spec = el.getAttribute("data-i18n-attr"); // "attr:key,attr2:key2"
			spec.split(",").forEach(function (pair) {
				var parts = pair.split(":");
				var attr = parts[0].trim();
				var key = parts[1].trim();
				var val = dict[key];
				if (val != null) el.setAttribute(attr, fmt(val, ctx));
			});
		});
		document.querySelectorAll(".lang-toggle button").forEach(function (b) {
			b.classList.toggle("on", b.getAttribute("data-lang") === lang);
		});
		// Post listings swap their cards through CSS keyed on <html lang>; this
		// lets page scripts react to the change too.
		document.dispatchEvent(new CustomEvent("langchange", { detail: { lang: lang } }));
	}

	function setLang(lang) {
		try { localStorage.setItem("lang", lang); } catch (e) {}
		// If we're on a post that has a paired translation in the target lang, redirect.
		var post = document.querySelector("[data-post-lang]");
		if (post) {
			var current = post.getAttribute("data-post-lang") || "id";
			var pair = post.getAttribute("data-post-pair") || "";
			if (pair && lang !== current) {
				window.location.href = pair;
				return;
			}
		}
		applyLang(lang);
	}

	// On initial load, if we landed on a post in the "wrong" language (e.g. EN
	// post while preference is ID), reflect that visually for this page only —
	// do NOT persist it, so future visits still default to Indonesian.
	function reconcilePostLang() {
		var post = document.querySelector("[data-post-lang]");
		if (!post) return null;
		return post.getAttribute("data-post-lang");
	}

	window.__i18n = { apply: applyLang, set: setLang, get: getLang };

	document.addEventListener("DOMContentLoaded", function () {
		document.querySelectorAll(".lang-toggle button").forEach(function (b) {
			b.addEventListener("click", function () { setLang(b.getAttribute("data-lang")); });
		});
		// Initial visual language: respect the current post's lang for visible chrome,
		// but the persisted preference (and DEFAULT_LANG) stays Indonesian.
		var postLang = reconcilePostLang();
		applyLang(postLang || getLang());
	});
})();
