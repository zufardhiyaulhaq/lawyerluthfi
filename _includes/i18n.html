			"guide.label": "Client Guide",
			"guide.title": "Client Guide: How It Works & FAQ",
			"guide.intro": "Dealing with the law can feel confusing, especially when life is already hard. This page explains how we work, what to prepare, and our answers to the questions we hear most often.",
			"guide.steps.title": "How It Works",
			"guide.step.1.title": "Message us on WhatsApp",
			"guide.step.1.body.html": "Tell us briefly what is happening; we reply within 24 hours at the latest.",
			"guide.step.2.title": "Free consultation",
			"guide.step.2.body.html": "Choose what suits you: online by WhatsApp or video call, at our office in Purbalingga, or a home visit by appointment.",
			"guide.step.3.title": "Agreement & power of attorney",
			"guide.step.3.body.html": "Once you understand the legal steps, the decision is yours; if you go ahead, you sign a <em>surat kuasa</em> (power of attorney) so the advocate can act for you.",
			"guide.step.4.title": "Support through to the judgment",
			"guide.step.4.body.html": "The advocate stays with you at every stage, including hearings at courts in other towns across the Banyumas region (Banyumas Raya).",
			"guide.confidential.html": "Your story is safe with us. An advocate must keep confidential everything they learn or receive from a client through their professional relationship, unless a statute provides otherwise (<strong>Pasal 19(1) (Article 19(1)) of UU No. 18 Tahun 2003 on Advocates</strong>). This duty continues after your relationship with the advocate ends (<strong>Pasal 4 letter h of the Kode Etik Advokat Indonesia, the Indonesian Advocates' Code of Ethics</strong>).",
			"guide.faq.title": "Frequently Asked Questions",
			"guide.faq.1.q": "Is the first consultation really free?",
			"guide.faq.1.a.html": "<p>Yes. The first consultation is free, with no obligation of any kind. You can tell us your story and ask questions until you understand your legal options. After that, you are free to decide whether to go ahead.</p>",
			"guide.faq.2.q": "Can I consult online?",
			"guide.faq.2.a.html": "<p>Yes. You can consult by WhatsApp chat or video call, so you do not need to come to the office. Documents can be sent as photos or PDFs. This also helps if you are working away from home or living abroad.</p>",
			"guide.faq.3.q": "I live outside Purbalingga. Can you still take my case?",
			"guide.faq.3.a.html": "<p>Yes. We serve Purbalingga, Banjarnegara, Purwokerto, Banyumas and Cilacap, and the advocate attends hearings in person at the Pengadilan Agama (Religious Court) and Pengadilan Negeri (District Court) in those areas. You can consult online, at our office, or at home by appointment.</p>",
			"guide.faq.4.q": "Will what I tell you be kept confidential?",
			"guide.faq.4.a.html": "<p>Yes. An advocate must keep confidential everything they learn or receive from a client through their professional relationship, unless a statute provides otherwise (<strong>Pasal 19(1) (Article 19(1)) of UU No. 18 Tahun 2003 on Advocates</strong>). The duty already applies at the consultation stage, because legal consultation is one of an advocate's legal services under that law. It continues after your relationship with the advocate ends (<strong>Pasal 4 letter h of the Kode Etik Advokat Indonesia, the Indonesian Advocates' Code of Ethics</strong>).</p>",
			"guide.faq.5.q": "What should I prepare before the consultation?",
			"guide.faq.5.a.html": "<p>Have photos or copies of the documents you have, plus a short timeline: what happened, when, and who was involved. If some documents are missing, that is fine. Tell us your story first.</p><ul><li><strong>Any case:</strong> KTP (ID card) and kartu keluarga (family card).</li><li><strong>Marriage &amp; divorce:</strong> buku nikah (marriage book) and your children's birth certificates.</li><li><strong>Inheritance:</strong> the death certificate of the deceased (pewaris), the names of the heirs, and proof of assets such as land certificates or bank books.</li><li><strong>Land:</strong> the certificate, girik/Letter C (old village land records), SPPT PBB (annual land tax bill), and the AJB (deed of sale) or kwitansi (receipt).</li><li><strong>Debts &amp; contracts:</strong> the written agreement, invoices or notes, proof of transfer, and related chat messages.</li></ul>",
			"guide.faq.6.q": "Do I have to attend the hearings myself?",
			"guide.faq.6.a.html": "<p>Often not: with a <em>surat kuasa khusus</em> (special power of attorney) from you, the advocate can represent you at many stages of the case. But some stages require you to attend in person, for example <em>mediasi</em> (a settlement meeting with a neutral mediator at the court), including in divorce cases (<strong>Pasal 6 (Article 6) of Perma (Supreme Court Regulation) No. 1 of 2016</strong>). In a <em>gugatan sederhana</em> (a small civil claim worth up to Rp500 million), you must attend every hearing (<strong>Pasal 4(4) of Perma No. 2 of 2015, as amended by Perma No. 4 of 2019</strong>). At the consultation, we explain which stages you need to attend.</p><p>For mediation, you may be absent only for a valid reason, such as illness backed by a doctor's letter or living abroad. Mediation meetings can also be held by remote video, and attending that way counts as attending in person (<strong>Pasal 5(3) and Pasal 6(2)–(4) of Perma No. 1 of 2016</strong>). In a <em>cerai gugat</em> (divorce filed by the wife) at the Pengadilan Agama, husband and wife must also appear in person at the reconciliation hearing, unless one of them lives abroad and cannot come (<strong>Pasal 82(2) of UU No. 7 Tahun 1989 on the Religious Courts</strong>).</p>",
			"guide.faq.7.q": "How long does a case usually take?",
			"guide.faq.7.a.html": "<p>There is no fixed answer, because it depends on the type of case, the evidence, and how the other side responds. As a benchmark, the Supreme Court sets a target for first-instance cases (at the Pengadilan Negeri or Pengadilan Agama) to finish within 5 months (<strong>SEMA No. 2 of 2014, a Supreme Court circular</strong>). A <em>gugatan sederhana</em> is capped at 25 working days from the first hearing (<strong>Pasal 5(3) of Perma No. 2 of 2015</strong>). These are targets and limits set by the rules, not guarantees, and they do not include an appeal (<em>banding</em>) or cassation (<em>kasasi</em>) to a higher court.</p>",

			"guide.faq.title": "常见问题",
			"guide.faq.1.q": "首次咨询真的免费吗？",
			"guide.faq.1.a.html": "<p>是的。首次咨询免费，且不附带任何义务。您可以讲述情况、提出问题，直到了解自己有哪些法律选择。之后是否继续，完全由您决定。</p>",
			"guide.faq.2.q": "可以在线咨询吗？",
			"guide.faq.2.a.html": "<p>可以。您可以通过 WhatsApp 聊天或视频通话咨询，无需亲自到办公室。文件可以照片或 PDF 形式发送。如果您正在外地工作或居住在国外，这种方式同样方便。</p>",
			"guide.faq.3.q": "我不住在普博林加，也能委托吗？",
			"guide.faq.3.a.html": "<p>可以。我们的服务范围包括普博林加、班贾内加拉、普沃克托、巴纽马斯和芝拉扎，律师会亲自出席上述地区宗教法院（Pengadilan Agama）和地方法院（Pengadilan Negeri）的庭审。您可以在线咨询、到办公室面谈，或预约上门拜访。</p>",
			"guide.faq.4.q": "我说的情况会被保密吗？",
			"guide.faq.4.a.html": "<p>会。律师对因执业关系而从客户处知悉或获得的一切事项负有保密义务，法律另有规定的除外（<strong>UU No. 18 Tahun 2003（律师法）第 19 条第 (1) 款</strong>）。由于法律咨询本身就属于律师的法律服务，这项义务从咨询阶段就开始适用。即使您与律师的关系结束，保密义务仍然有效（<strong>Kode Etik Advokat Indonesia（印尼律师职业道德准则）第 4 条 h 项</strong>）。</p>",
			"guide.faq.5.q": "咨询前需要准备什么？",
			"guide.faq.5.a.html": "<p>请准备好手头文件的照片或复印件，并写一份简短的经过：发生了什么、什么时候、涉及哪些人。文件不齐全也没关系，可以先把情况告诉我们。</p><ul><li><strong>所有案件：</strong> KTP（身份证）和 kartu keluarga（户口簿）。</li><li><strong>婚姻与离婚：</strong> buku nikah（结婚证书）和子女的出生证明。</li><li><strong>继承：</strong> 被继承人（pewaris，即去世者）的死亡证明、继承人名单，以及土地证书、存折等财产证明。</li><li><strong>土地：</strong> 土地证书、girik／Letter C（旧式村级土地凭证）、SPPT PBB（年度土地与建筑税缴税通知单），以及 AJB（买卖契约书）或 kwitansi（收据）。</li><li><strong>欠款与合同：</strong> 书面协议、发票或单据、转账凭证，以及相关的聊天记录。</li></ul>",
			"guide.faq.6.q": "我必须亲自出庭吗？",
			"guide.faq.6.a.html": "<p>很多情况下不必：只要您签署特别授权委托书（surat kuasa khusus），律师即可在许多审理阶段代表您。但有些阶段要求您本人到场，例如调解（mediasi，即在法院由中立调解员主持的和解协商），离婚案件也不例外（<strong>Perma No. 1 Tahun 2016（最高法院条例）第 6 条</strong>）。在简易诉讼（gugatan sederhana，标的额不超过 5 亿印尼盾的民事诉讼）中，您必须出席每一次庭审（<strong>Perma No. 2 Tahun 2015 jo. Perma No. 4 Tahun 2019 第 4 条第 (4) 款</strong>）。咨询时，我们会说明哪些阶段需要您亲自出席。</p><p>调解只有在有正当理由时才可缺席，例如持医生证明的疾病或居住在国外。调解会议也可以通过远程视频进行，以这种方式参加视为亲自出席（<strong>Perma No. 1 Tahun 2016 第 5 条第 (3) 款及第 6 条第 (2)–(4) 款</strong>）。在宗教法院由妻子提起的离婚诉讼（cerai gugat）中，夫妻双方还必须亲自出席和解庭，除非其中一方居住在国外且无法到庭（<strong>UU No. 7 Tahun 1989（宗教法院法）第 82 条第 (2) 款</strong>）。</p>",
			"guide.faq.7.q": "案件一般需要多长时间？",
			"guide.faq.7.a.html": "<p>没有固定答案，因为时间取决于案件类型、证据情况以及对方的态度。作为参考，最高法院要求一审案件（在地方法院或宗教法院）以最迟 5 个月审结为目标（<strong>SEMA No. 2 Tahun 2014（最高法院通函）</strong>）。简易诉讼的审理期限为自首次开庭起最多 25 个工作日（<strong>Perma No. 2 Tahun 2015 第 5 条第 (3) 款</strong>）。这些都是规则设定的目标和上限，并非保证，而且不包括上诉（banding）或向最高法院提出的上诉（kasasi）。</p>",

			"guide.faq.3.a.html": "<p>はい。プルバリンガ、バンジャルネガラ、プルウォケルト、バニュマス、チラチャップに対応しており、これらの地域の宗教裁判所（Pengadilan Agama）と地方裁判所（Pengadilan Negeri）の審理に弁護士が直接出廷します。ご相談はオンライン、事務所、予約制のご自宅訪問からお選びいただけます。</p>",
			"guide.faq.4.q": "話した内容は秘密にしてもらえますか？",
			"guide.faq.4.a.html": "<p>はい。弁護士は、職務上の関係を通じて依頼者から知り得た、または受け取ったすべての事項について守秘義務を負います。ただし、法律に別段の定めがある場合は除きます（<strong>UU No. 18 Tahun 2003（弁護士法）第 19 条第 (1) 項</strong>）。法律相談も弁護士の法的サービスに含まれるため、この義務はご相談の段階から適用されます。弁護士との関係が終わった後も、守秘義務は続きます（<strong>Kode Etik Advokat Indonesia（インドネシア弁護士倫理規程）第 4 条 h 号</strong>）。</p>",
			"guide.faq.5.q": "相談の前に何を準備すればよいですか？",
			"guide.faq.5.a.html": "<p>お手元の書類の写真またはコピーと、簡単な経緯のメモ（何が、いつ、誰との間で起きたか）をご用意ください。書類がそろっていなくても大丈夫です。まずは状況をお聞かせください。</p><ul><li><strong>すべての案件：</strong> KTP（身分証）と kartu keluarga（世帯票）。</li><li><strong>婚姻・離婚：</strong> buku nikah（婚姻手帳）とお子さまの出生証明書。</li><li><strong>相続：</strong> 被相続人（pewaris、亡くなった方）の死亡証明書、相続人の氏名、土地証書や預金通帳などの財産資料。</li><li><strong>土地：</strong> 土地証書、girik／Letter C（村の旧来の土地証票）、SPPT PBB（年次の土地建物税の納税通知書）、AJB（売買証書）または kwitansi（領収書）。</li><li><strong>貸金・契約：</strong> 契約書、請求書や伝票、振込の記録、関連するチャットのやり取り。</li></ul>",
			"guide.faq.6.q": "裁判には本人が出席しなければなりませんか？",
			"guide.faq.6.a.html": "<p>多くの場合その必要はなく、特別委任状（surat kuasa khusus）をいただければ、弁護士が多くの段階であなたを代理できます。ただし、調停（mediasi：裁判所で中立の調停人を交えて行う和解協議）のように本人の出席が必要な段階もあり、離婚事件も含まれます（<strong>Perma No. 1 Tahun 2016（最高裁判所規則）第 6 条</strong>）。簡易訴訟（gugatan sederhana：請求額 5 億ルピア以下の民事訴訟）では、すべての期日に出席する必要があります（<strong>Perma No. 2 Tahun 2015 jo. Perma No. 4 Tahun 2019 第 4 条第 (4) 項</strong>）。どの段階に出席が必要かは、ご相談の際にご説明します。</p><p>調停を欠席できるのは、医師の診断書がある病気や海外在住などの正当な理由がある場合に限られます。また、調停はビデオによる遠隔方式でも行うことができ、その方法での参加は本人の出席とみなされます（<strong>Perma No. 1 Tahun 2016 第 5 条第 (3) 項・第 6 条第 (2)～(4) 項</strong>）。宗教裁判所で妻が申し立てる離婚訴訟（cerai gugat）では、夫婦が和解期日に本人で出頭する必要もあります。ただし、一方が海外に住んでいて出頭できない場合は除きます（<strong>UU No. 7 Tahun 1989（宗教裁判所法）第 82 条第 (2) 項</strong>）。</p>",
			"guide.faq.7.q": "裁判にはふつうどのくらいかかりますか？",
			"guide.faq.7.a.html": "<p>事件の種類、証拠、相手方の対応によって変わるため、決まった答えはありません。目安として、最高裁判所は第一審（地方裁判所または宗教裁判所）の事件を遅くとも 5 か月以内に終えることを目標としています（<strong>SEMA No. 2 Tahun 2014（最高裁判所通達）</strong>）。簡易訴訟は、初回期日から最長 25 営業日と定められています（<strong>Perma No. 2 Tahun 2015 第 5 条第 (3) 項</strong>）。これらは規則上の目標・上限であって保証ではなく、控訴（banding）や上告（kasasi）の期間は含みません。</p>",

			"blog.eyebrow": "法律コラム",

			"post.author": "著者",
			"post.keep_reading": "続けて読む",

			"archive.eyebrow": "カテゴリー",
			"archive.lead.html": "<strong>{TITLE}</strong>カテゴリーのすべての記事を表示しています。代わりに<a href=\"{BLOG}\">すべての記事を見る</a>。",

			"404.eyebrow": "404",

	};

	var YEAR = new Date().getFullYear();
	var BLOG = "{{ site.baseurl }}/blog/";
	var DEFAULT_LANG = "id";
	// Kept at "2": this change only ADDS languages (zh/ja); a stored "id"/"en"
	// still means exactly what it did, so returning visitors keep their choice.
	// Bump only when the meaning of an existing stored value changes.
	var LANG_VERSION = "2";
	var LANGS = ["id", "en", "zh", "ja"];
	// BCP47 value for <html lang> (SEO + screen readers); zh is Simplified.
	var BCP47 = { id: "id", en: "en", zh: "zh-Hans", ja: "ja" };
	// Short label shown on the compact switcher trigger.
	var CODES = { id: "ID", en: "EN", zh: "中", ja: "日" };
	// WhatsApp click-to-chat. Every consultation link carries data-wa="<topic>"
	// (umum, perkawinan, waris, tanah, perdata) and is built server-side with the
	// Indonesian message (_includes/wa-attrs.html), so it works without JS. Here
	// the active language's message (wa.msg.<topic>) is swapped in. The suffix
	// stays Indonesian in every language on purpose: it is a tag the advocate
	// searches for in WhatsApp to find leads from the site.
	var WA_NUMBER = {{ site.data.whatsapp.number | jsonify }};
	var WA_SUFFIX = {{ site.data.whatsapp.suffix | jsonify }};
	// encodeURIComponent, plus the RFC 3986 characters it leaves alone (!'()*),
	// so the Indonesian link is byte-identical to the server-built one.
	function waEncode(s) {
		return encodeURIComponent(s).replace(/[!'()*]/g, function (c) {
			return "%" + c.charCodeAt(0).toString(16).toUpperCase();
		});
	}
	function waHref(topic, dict) {
		var key = "wa.msg." + topic;
		var msg = (dict[key] != null) ? dict[key] : I18N[DEFAULT_LANG][key];
		if (msg == null) return null;
		return "https://wa.me/" + WA_NUMBER + "?text=" + waEncode(msg + WA_SUFFIX);
	}

	function fmt(s, ctx) {
		return s.replace(/\{(\w+)\}/g, function (_, k) {
			return (ctx && ctx[k] != null) ? ctx[k] : ({ YEAR: YEAR, BLOG: BLOG }[k] || "");
		});
	}

	function getLang() {
		try {
			var ver = localStorage.getItem("lang_v");
			if (ver !== LANG_VERSION) {
				localStorage.removeItem("lang");
				localStorage.setItem("lang_v", LANG_VERSION);
				return DEFAULT_LANG;
			}
			var stored = localStorage.getItem("lang");
			if (LANGS.indexOf(stored) !== -1) return stored;
		} catch (e) {}
		return DEFAULT_LANG;
	}

	function applyLang(lang) {
		if (LANGS.indexOf(lang) === -1) lang = DEFAULT_LANG;
		var dict = I18N[lang] || I18N[DEFAULT_LANG];
		// lang = BCP47 for SEO/a11y; data-lang = internal code the listing CSS keys on.
		document.documentElement.lang = BCP47[lang] || lang;
		document.documentElement.setAttribute("data-lang", lang);
		var ctx = { TITLE: document.body.dataset.archiveTitle || "" };
		document.querySelectorAll("[data-i18n]").forEach(function (el) {
			var key = el.getAttribute("data-i18n");
			var val = dict[key];
			if (val == null) return;
			if (key.endsWith(".html") || el.hasAttribute("data-i18n-html")) {
				el.innerHTML = fmt(val, ctx);
			} else {
				el.textContent = fmt(val, ctx);
			}
		});
		document.querySelectorAll("[data-i18n-attr]").forEach(function (el) {
			var spec = el.getAttribute("data-i18n-attr"); // "attr:key,attr2:key2"
			spec.split(",").forEach(function (pair) {
				var parts = pair.split(":");
				var attr = parts[0].trim();
				var key = parts[1].trim();
				var val = dict[key];
				if (val != null) el.setAttribute(attr, fmt(val, ctx));
			});
		});
		// WhatsApp consultation links: prefill the message in the active language.
		document.querySelectorAll("a[data-wa]").forEach(function (a) {
			var href = waHref(a.getAttribute("data-wa"), dict);
			if (href) a.setAttribute("href", href);
		});
		// Reflect the active language in every switcher control.
		document.querySelectorAll("button[data-lang]").forEach(function (b) {
			var on = b.getAttribute("data-lang") === lang;
			b.classList.toggle("on", on);
			if (on) { b.setAttribute("aria-current", "true"); } else { b.removeAttribute("aria-current"); }
		});
		document.querySelectorAll("[data-lang-code]").forEach(function (el) {
			el.textContent = CODES[lang] || lang.toUpperCase();
		});
		// Post listings swap their cards through CSS keyed on <html data-lang>; this
		// lets page scripts (blog filter, services page) react to the change too.
		document.dispatchEvent(new CustomEvent("langchange", { detail: { lang: lang } }));
	}

	// Find the URL of this post's sibling in the target language, if one exists.
	// Prefers the 4-way translation group (data-post-siblings, written from the
	// post's `ref` front matter); falls back to the legacy one-to-one `pair`.
	function postSibling(targetLang) {
		var post = document.querySelector("[data-post-lang]");
		if (!post) return null;
		var raw = post.getAttribute("data-post-siblings");
		if (raw) {
			try {
				var map = JSON.parse(raw);
				if (map && map[targetLang]) return map[targetLang];
			} catch (e) {}
		}
		// Legacy id<->en pair: the only sibling we know is the opposite language.
		var cur = post.getAttribute("data-post-lang") || "id";
		var pair = post.getAttribute("data-post-pair") || "";
		var opposite = (cur === "en") ? "id" : "en";
		if (pair && targetLang === opposite) return pair;
		return null;
	}

	function setLang(lang) {
		if (LANGS.indexOf(lang) === -1) lang = DEFAULT_LANG;
		try { localStorage.setItem("lang", lang); localStorage.setItem("lang_v", LANG_VERSION); } catch (e) {}
		// If we're on a post that has a sibling in the target language, jump to it.
		var dest = postSibling(lang);
		if (dest) { window.location.href = dest; return; }
		applyLang(lang);
	}

	// On initial load, if we landed on a post in the "wrong" language (e.g. an EN
	// post while the stored preference is ID), reflect that visually for this page
	// only — do NOT persist it, so future visits still default to Indonesian.
	function reconcilePostLang() {
		var post = document.querySelector("[data-post-lang]");
		if (!post) return null;
		return post.getAttribute("data-post-lang");
	}

	window.__i18n = { apply: applyLang, set: setLang, get: getLang };

	function closeAllPickers(except) {
		document.querySelectorAll("[data-lang-picker]").forEach(function (p) {
			if (p === except) return;
			var trig = p.querySelector("[aria-expanded]");
			var menu = p.querySelector(".lang-menu");
			if (trig) trig.setAttribute("aria-expanded", "false");
			if (menu) menu.hidden = true;
		});
	}

	document.addEventListener("DOMContentLoaded", function () {
		// Language choice buttons (the nav dropdown options and the mobile row).
		document.querySelectorAll("button[data-lang]").forEach(function (b) {
			b.addEventListener("click", function () {
				closeAllPickers();
				setLang(b.getAttribute("data-lang"));
			});
		});
		// Disclosure trigger(s) for the compact nav picker.
		document.querySelectorAll("[data-lang-picker]").forEach(function (picker) {
			var trig = picker.querySelector("[aria-expanded]");
			var menu = picker.querySelector(".lang-menu");
			if (!trig || !menu) return;
			menu.addEventListener("click", function (e) { e.stopPropagation(); });
			trig.addEventListener("click", function (e) {
				e.stopPropagation();
				var open = trig.getAttribute("aria-expanded") === "true";
				closeAllPickers();
				trig.setAttribute("aria-expanded", open ? "false" : "true");
				menu.hidden = open;
				if (!open) {
					var first = menu.querySelector("button[data-lang]");
					if (first) first.focus();
				}
			});
		});
		// Dismiss open pickers on outside click or Escape.
		document.addEventListener("click", function () { closeAllPickers(); });
		document.addEventListener("keydown", function (e) {
			if (e.key === "Escape") {
				var openTrig = document.querySelector("[data-lang-picker] [aria-expanded='true']");
				closeAllPickers();
				if (openTrig) openTrig.focus();
			}
		});
		// Initial visual language: respect the current post's own language for the
		// visible chrome, but the persisted preference (and DEFAULT_LANG) stays ID.
		var postLang = reconcilePostLang();
		applyLang(postLang || getLang());
	});
})();
</script>
