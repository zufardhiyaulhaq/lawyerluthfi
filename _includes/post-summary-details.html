<div class="post-meta">
	<span>{{ include.post.date | date: '%-d %B %Y' }}</span>
	{% if include.post.content %}
		<span>·</span>
		<span>{{ include.post.content | strip_html | number_of_words | divided_by: 200 | plus: 1 }} menit baca</span>
	{% endif %}
	{% for category in include.post.categories %}
		<span>·</span>
		<a href="{{ site.baseurl }}/category/{{ category | slugify }}/">{{ category }}</a>
	{% endfor %}
</div>
